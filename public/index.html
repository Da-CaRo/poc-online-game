<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer PoC</title>
    <style>
        :root { --bg: #1a1a1a; --primary: #00d1ff; --secondary: #ff006e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        #titulo { margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        /* Estilos del Tablero (Host) */
        .grid-host { display: grid; grid-template-columns: repeat(3, 120px); gap: 15px; }
        .celda-host { width: 120px; height: 120px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 4rem; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s; }
        .celda-host.X { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
        .celda-host.O { color: var(--secondary); text-shadow: 0 0 15px var(--secondary); }

        /* Estilos del Mando (Player) */
        .grid-mando { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 90vw; max-width: 400px; }
        .btn-mando { aspect-ratio: 1; border: none; background: #444; color: white; font-size: 2rem; border-radius: 50%; box-shadow: 0 6px 0 #222; transition: 0.1s; }
        .btn-mando:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #222; }
        .btn-mando:disabled { opacity: 0.3; }

        .btn-reiniciar { margin-top: 30px; padding: 10px 25px; background: white; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .oculto { display: none; }
    </style>
</head>
<body>

    <h1 id="titulo">Conectando...</h1>

    <div id="vista-host" class="oculto">
        <div class="grid-host" id="tablero-host"></div>
        <button class="btn-reiniciar" onclick="socket.emit('reiniciar')">Reiniciar Juego</button>
    </div>

    <div id="vista-player" class="oculto">
        <div class="grid-mando" id="tablero-mando"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const rol = urlParams.get('role'); // 'host' o 'player'
        let miFicha = null;

        if (rol === 'host') {
            document.getElementById('vista-host').classList.remove('oculto');
            socket.emit('registrar-host');
        } else {
            document.getElementById('vista-player').classList.remove('oculto');
            socket.emit('registrar-jugador');
        }

        socket.on('asignar-ficha', (ficha) => {
            miFicha = ficha;
            document.getElementById('titulo').innerText = "Eres: " + ficha;
        });

        socket.on('actualizar-estado', (estado) => {
            actualizarUI(estado);
        });

        function actualizarUI(estado) {
            const titulo = document.getElementById('titulo');
            
            // Gestionar mensajes de estado
            if (estado.ganador) {
                titulo.innerText = estado.ganador === 'Empate' ? "¡EMPATE!" : `¡GANADOR: ${estado.ganador}!`;
                titulo.style.color = "gold";
            } else if (miFicha) {
                titulo.innerText = (estado.turnoActual === miFicha) ? "TU TURNO" : `ESPERA A ${estado.turnoActual}`;
                titulo.style.color = (estado.turnoActual === miFicha) ? "#00ff00" : "white";
            } else if (rol === 'host') {
                titulo.innerText = `TURNO DE: ${estado.turnoActual}`;
            }

            // Renderizar Tablero u Mando
            const containerId = (rol === 'host') ? 'tablero-host' : 'tablero-mando';
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            estado.tablero.forEach((valor, i) => {
                if (rol === 'host') {
                    const div = document.createElement('div');
                    div.className = `celda-host ${valor || ''}`;
                    div.innerText = valor || '';
                    container.appendChild(div);
                } else {
                    const btn = document.createElement('button');
                    btn.className = 'btn-mando';
                    btn.innerText = valor || i + 1;
                    // Solo habilitado si es mi turno, no hay ganador y la celda está vacía
                    btn.disabled = (estado.turnoActual !== miFicha || valor !== null || estado.ganador);
                    btn.onclick = () => socket.emit('intento-movimiento', i);
                    container.appendChild(btn);
                }
            });
        }
    </script>
</body>
</html>
